<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Critique</title>
  <style>
    body { margin: 0; width: 260px; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1c1c1f; background: #f6f4f1; }
    main { padding: 14px 16px 12px; }
    h1 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #a3a19b; flex: none; }
    .dot.on { background: #2da44e; }
    .dot.connecting { background: #e0a800; }
    .hint { margin: 8px 0 0; color: #787570; line-height: 1.45; }
    code { font: 11px ui-monospace, Menlo, monospace; }
    button { margin-top: 12px; padding: 5px 10px; font: inherit; border: 1px solid #e8e6e1; border-radius: 7px; background: #fff; cursor: pointer; }
    button:hover { background: #faf9f7; }
  </style>
</head>
<body>
  <main>
    <h1>Critique</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="text">Checking…</span></div>
    <p class="hint" id="hint"></p>
    <button id="retry">Reconnect</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
