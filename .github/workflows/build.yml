# Makes sure the Mac app still builds and its tests pass on pull requests.
# Pushes to main get the same check from release.yml before it publishes.
name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the app
        run: make app SIGN_ID=-
      - name: Run the tests
        run: swift test
