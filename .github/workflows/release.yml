# Tag a version (git tag v0.1.0 && git push --tags) to publish a downloadable build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build the DMG
        run: make dmg SIGN_ID=-
      - uses: softprops/action-gh-release@v2
        with:
          files: build/Critique.dmg
          generate_release_notes: true
